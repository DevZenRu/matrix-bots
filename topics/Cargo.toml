[package]
name = "devzen-matrix-topics-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
matrix-sdk = { version = "0.10", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
